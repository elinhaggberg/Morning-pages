<!-- ===== Guides / Instructions ===== -->
<template id="tpl-instructions">
  <div class="sheet instructions-sheet">
    <header class="sheet-header">
      <h2>Instructions</h2>
      <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
    </header>
    <div class="instructions-body">
      <section>
        <h3>Installing on your phone</h3>
        <p>This is a web app, not an app-store app — but you can add it to your Home Screen so it opens full-screen, just like a regular app.</p>
        <p><strong>iOS (Safari):</strong> tap the Share icon, then "Add to Home Screen".</p>
        <p><strong>Android (Chrome):</strong> tap the ⋮ menu, then "Add to Home screen" (or "Install app").</p>
      </section>
      <section>
        <h3>Writing a page</h3>
        <p>Open the app and it goes straight to a blank page — no setup, no prompts. Write anything, in any direction; morning pages aren't meant to be good, they're meant to clear your head. The word count at the bottom is just a quiet marker against a daily goal (750 words, roughly three handwritten pages, by default — change it any time in Customize) with a small checkmark once you reach it. There's no requirement to stop there, or to reach it at all.</p>
      </section>
      <section>
        <h3>Saving to your log</h3>
        <p>Tap <strong>Save to log</strong> to file a page away as a card and start fresh. Everything autosaves as you type regardless, so closing the app mid-page never loses your words — reopening resumes exactly where you left off.</p>
      </section>
      <section>
        <h3>More than one page a day</h3>
        <p>Once a day has a page saved to the log, a small <strong>+</strong> appears to start another — useful if you want to use this more like a diary than a single morning ritual.</p>
      </section>
      <section>
        <h3>Privacy &amp; the four words</h3>
        <p>Every page is encrypted with the four-word phrase you set up when you first opened the app. It's never stored anywhere, which means every fresh visit asks for it again — and it also means there is no password reset. Losing the phrase means losing everything written under it, permanently.</p>
        <p>A page's actual text is never shown anywhere except right after you tap to open it — cards in My Log and the Calendar only ever show a date, a time, and a word count.</p>
      </section>
      <section>
        <h3>My Log &amp; the Calendar</h3>
        <p>My Log holds every day you've ever written something. The Calendar (in this menu) lets you catch up on a day you skipped — tap a missed day to write something for it retroactively.</p>
      </section>
      <section>
        <h3>Your data, your device</h3>
        <p>Everything lives only in this browser, on this device — there's no account and no server. <strong>Export &amp; manage data</strong> lets you export a full, still-encrypted backup at any time.</p>
        <p><strong>Removing the app from your Home Screen deletes its saved data too.</strong> Export a backup every so often.</p>
      </section>
    </div>
  </div>
</template>

<!-- ===== About Morning Pages (guide) ===== -->
<template id="tpl-about">
  <div class="sheet instructions-sheet">
    <header class="sheet-header">
      <h2>About Morning Pages</h2>
      <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
    </header>
    <div class="instructions-body">
      <section>
        <h3>Where the practice comes from</h3>
        <p>Morning Pages were introduced by <strong>Julia Cameron</strong> in her 1992 book <strong>The Artist's Way</strong>, where they're the foundational daily tool of her twelve-week course in creative recovery. Millions of people have used the book's program since; the pages are the one piece of it that tends to outlast the rest.</p>
      </section>
      <section>
        <h3>The practice itself</h3>
        <p>Three pages, longhand, first thing in the morning — before email, before the day has a chance to get its hooks in. Whatever's in your head goes on the page: complaints, plans, fragments, nonsense. There's no wrong way to do it, and no editing as you go.</p>
      </section>
      <section>
        <h3>Not meant to be read</h3>
        <p>Cameron is specific about this: the pages aren't for anyone, including — deliberately — a later version of you. Rereading them defeats the point, which is to empty your mind onto paper without performing for an audience of any kind. She's described them as something closer to a daily meditation than a piece of writing.</p>
      </section>
      <section>
        <h3>Go deeper</h3>
        <p>This app follows the spirit of the practice but is a small, informal digital stand-in — <strong>The Artist's Way</strong> by Julia Cameron is worth reading in full for the complete course, including everything the pages are meant to support.</p>
      </section>
    </div>
  </div>
</template>
